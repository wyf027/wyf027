name: Update 3D contribution calendar

on:
  schedule:
    # Daily at 11:27 Asia/Shanghai (03:27 UTC).
    - cron: "27 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"

permissions:
  contents: read

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Generate 3D calendar from wyf027's contributions
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: wyf027

      - name: Publish 3D contribution images
        run: |
          test -s profile-3d-contrib/profile-night-view.svg
          test -s profile-3d-contrib/profile-green-animate.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "Contribution images are already up to date."
            exit 0
          fi
          git commit -m "docs: refresh wyf027 3D contribution calendar"
          git pull --rebase origin main
          git push origin HEAD:main
